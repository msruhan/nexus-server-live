<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1f33"/>
      <stop offset="60%" stop-color="#18596f"/>
      <stop offset="100%" stop-color="#5d9bb0"/>
    </linearGradient>
    <radialGradient id="glow4" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7eb3c5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow5" cx="90%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#d6a35a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#bg3)"/>
  <rect width="1600" height="500" fill="url(#glow4)"/>
  <rect width="1600" height="500" fill="url(#glow5)"/>
  <!-- Dot pattern -->
  <g fill="white" fill-opacity="0.06">
    <circle cx="50" cy="50" r="3"/><circle cx="130" cy="50" r="3"/><circle cx="210" cy="50" r="3"/>
    <circle cx="290" cy="50" r="3"/><circle cx="370" cy="50" r="3"/><circle cx="450" cy="50" r="3"/>
    <circle cx="50" cy="130" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="210" cy="130" r="3"/>
    <circle cx="290" cy="130" r="3"/><circle cx="370" cy="130" r="3"/><circle cx="450" cy="130" r="3"/>
    <circle cx="50" cy="210" r="3"/><circle cx="130" cy="210" r="3"/><circle cx="210" cy="210" r="3"/>
    <circle cx="50" cy="290" r="3"/><circle cx="130" cy="290" r="3"/><circle cx="210" cy="290" r="3"/>
    <circle cx="50" cy="370" r="3"/><circle cx="130" cy="370" r="3"/>
    <circle cx="50" cy="450" r="3"/>
  </g>
  <!-- Globe/network icon -->
  <g transform="translate(1100, 100)" stroke="white" stroke-opacity="0.15" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="90"/>
    <ellipse cx="100" cy="100" rx="45" ry="90"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <line x1="30" y1="55" x2="170" y2="55"/>
    <line x1="30" y1="145" x2="170" y2="145"/>
  </g>
  <!-- Carrier logos placeholder -->
  <g transform="translate(1100, 340)" font-family="system-ui, sans-serif" font-size="13" fill="white" fill-opacity="0.4" font-weight="600">
    <text x="0" y="0">T-Mobile</text>
    <text x="80" y="0">AT&amp;T</text>
    <text x="140" y="0">Verizon</text>
    <text x="220" y="0">EE</text>
    <text x="250" y="0">Vodafone</text>
  </g>
  <!-- Text -->
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
    Network Unlock
  </text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#7eb3c5" letter-spacing="-1.5">
    200+ Carriers
  </text>
  <text x="80" y="295" font-family="Georgia, serif" font-size="24" fill="white" fill-opacity="0.85" font-style="italic">
    Samsung · iPhone · Xiaomi · all brands supported
  </text>
  <text x="80" y="345" font-family="monospace" font-size="13" fill="white" fill-opacity="0.5" letter-spacing="2">
    MEDIAN DELIVERY: 2 MINUTES · AUTO-REFUND ON REJECTION
  </text>
  <rect x="80" y="380" width="220" height="48" rx="24" fill="white"/>
  <text x="120" y="410" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0c1f33">
    Browse Carriers →
  </text>
  <!-- New badge -->
  <rect x="80" y="90" width="80" height="28" rx="14" fill="#d6a35a"/>
  <text x="98" y="109" font-family="monospace" font-size="11" font-weight="700" fill="#0c1f33" letter-spacing="1.5">
    NEW
  </text>
</svg>
