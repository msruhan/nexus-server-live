name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest or v1.0.0)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/msruhan/nexus-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package.json version with image tag
        run: npm pkg set version="${{ steps.meta.outputs.tag }}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Register release draft in NexusPortal
        if: github.event_name == 'push'
        env:
          PORTAL_RELEASE_SYNC_URL: ${{ secrets.PORTAL_RELEASE_SYNC_URL }}
          RELEASE_SYNC_SECRET: ${{ secrets.RELEASE_SYNC_SECRET }}
        run: |
          if [[ -z "$PORTAL_RELEASE_SYNC_URL" || -z "$RELEASE_SYNC_SECRET" ]]; then
            echo "Skipping Portal release sync (secrets not configured)."
            exit 0
          fi
          VERSION="${{ steps.meta.outputs.tag }}"
          IMAGE="${{ env.IMAGE_NAME }}:${VERSION}"
          CHANGELOG=$(git tag -l --format='%(contents)' "v${VERSION}" 2>/dev/null | head -c 4000)
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="Docker release ${VERSION}"
          fi
          BODY=$(jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE" \
            --arg changelog "$CHANGELOG" \
            '{version:$version,dockerImage:$image,changelog:$changelog}')
          curl -fsS -X POST "$PORTAL_RELEASE_SYNC_URL" \
            -H "Authorization: Bearer $RELEASE_SYNC_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY"
