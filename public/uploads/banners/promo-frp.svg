<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="40%" stop-color="#2a1f12"/>
      <stop offset="100%" stop-color="#b8551f"/>
    </linearGradient>
    <radialGradient id="glow3" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e3996a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#bg2)"/>
  <rect width="1600" height="500" fill="url(#glow3)"/>
  <!-- Diagonal lines -->
  <g stroke="white" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="500" x2="500" y2="0"/>
    <line x1="200" y1="500" x2="700" y2="0"/>
    <line x1="400" y1="500" x2="900" y2="0"/>
    <line x1="600" y1="500" x2="1100" y2="0"/>
    <line x1="800" y1="500" x2="1300" y2="0"/>
    <line x1="1000" y1="500" x2="1500" y2="0"/>
    <line x1="1200" y1="500" x2="1600" y2="100"/>
  </g>
  <!-- Phone silhouette -->
  <g transform="translate(1150, 80)">
    <rect x="0" y="0" width="140" height="280" rx="20" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="2"/>
    <rect x="50" y="8" width="40" height="6" rx="3" fill="white" fill-opacity="0.15"/>
    <rect x="10" y="30" width="120" height="220" rx="4" fill="white" fill-opacity="0.04"/>
